<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8efe6; /* Color cálido tipo local comercial */
            color: #3d2b1f;
            font-family: 'Segoe UI', sans-serif;
        }
        .custom-btn {
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }
        .custom-btn:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #6b3e26;
        }
        .btn-primary {
            background-color: #a0522d;
            border-color: #a0522d;
        }
        .btn-success {
            background-color: #c38e3f;
            border-color: #c38e3f;
            color: #fff;
        }
        .btn-warning {
            background-color: #d4a95a;
            border-color: #d4a95a;
            color: #fff;
        }
        footer {
            background-color: #3d2b1f;
            color: #ffffff;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">ALQUILER DE PELÍCULAS</h1>

    <div class="row justify-content-center text-center">
        <div class="col-md-3 mb-4">
            <a href="/peliculas" class="btn btn-primary custom-btn w-100 mb-2">Películas</a>
            <img src="https://imgmedia.libero.pe/1200x630/libero/migration/imagen/2019/05/22/noticia-1558561795-cinemark-cartelera.jpg"
                 alt="Películas destacadas" style="height: 200px;" class="img-fluid rounded">
        </div>
        <div class="col-md-3 mb-4">
            <a href="/clientes/lista" class="btn btn-success custom-btn w-100 mb-2">Clientes</a>

            <img src="https://coworkingfy.com/wp-content/uploads/2023/10/tipos-de-clientes.jpg"
                            alt="Películas destacadas" style="height: 200px;" class="img-fluid rounded">

        </div>
        <div class="col-md-3 mb-4">
            <a href="/alquileres/lista" class="btn btn-warning custom-btn w-100 mb-2">Alquiler de Películas</a>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTByDeIBxkO2IM9aQvVwLs6-Jgdd7N3vGLGIQ&s"
                 alt="Películas destacadas" style="height: 200px;" class="img-fluid rounded">
        </div>
    </div>
</div>

<footer>
    © Juber2025
</footer>

</body>
</html>
