<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${pelicula.idPelicula == null} ? 'Crear Película' : 'Editar Película'">Formulario Película</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #fdf6ec; /* Fondo claro cálido */
            font-family: 'Segoe UI', sans-serif;
            color: #3a2e1f;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #6b3e26;
            margin-bottom: 30px;
        }

        label {
            font-weight: 600;
            color: #4a3b2a;
        }

        .btn-custom {
            border-radius: 20px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background-color: #a0522d;
            border-color: #a0522d;
        }

        .btn-secondary {
            background-color: #8c735a;
            border-color: #8c735a;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="form-container">
        <h2 th:text="${pelicula.idPelicula == null} ? 'Crear Nueva Película' : 'Editar Película'"></h2>

        <form th:action="@{/peliculas}" th:object="${pelicula}" method="post" class="mt-4">
            <input type="hidden" th:field="*{idPelicula}"/>

            <div class="mb-3">
                <label for="titulo" class="form-label">Título:</label>
                <input type="text" id="titulo" th:field="*{titulo}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label for="genero" class="form-label">Género:</label>
                <input type="text" id="genero" th:field="*{genero}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label for="stock" class="form-label">Stock:</label>
                <input type="number" id="stock" th:field="*{stock}" class="form-control" required min="0"/>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary btn-custom">
                    <span th:text="${pelicula.idPelicula == null} ? 'Guardar' : 'Actualizar'"></span>
                </button>
                <a th:href="@{/peliculas}" class="btn btn-secondary btn-custom">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
