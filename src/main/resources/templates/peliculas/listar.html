<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Películas</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #fdf6ec; /* Fondo claro cálido */
            font-family: 'Segoe UI', sans-serif;
            color: #3a2e1f;
        }

        .full-height {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #6b3e26;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .btn-custom {
            border-radius: 20px;
            font-weight: 500;
            padding: 8px 16px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .btn-success {
            background-color: #a67c52;
            border-color: #a67c52;
        }

        .btn-success:hover {
            background-color: #8c6239;
            border-color: #8c6239;
        }

        .table-container {
            flex: 1;
        }

        .table {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .table-dark th {
            background-color: #6b3e26;
        }

        .alert {
            font-weight: bold;
        }

        footer {
            background-color: #3a2e1f;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

<div class="full-height container d-flex flex-column">
    <h1>LISTA DE PELÍCULAS</h1>

    <div class="d-flex justify-content-between mb-4">
        <a th:href="@{/peliculas/nuevo}" class="btn btn-success btn-custom">AGREGAR NUEVO TÍTULO</a>
        <a th:href="@{/index}" class="btn btn-success btn-custom">INICIO</a>
    </div>

    <div class="table-container mb-4">
        <!-- Mostrar mensaje si la lista está vacía -->
        <div th:if="${#lists.isEmpty(peliculas)}" class="alert alert-info text-center">
            No hay películas registradas.
        </div>

        <!-- Mostrar tabla solo si hay películas -->
        <table class="table table-striped table-hover text-center" th:if="${!#lists.isEmpty(peliculas)}">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Género</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pelicula : ${peliculas}">
                    <td th:text="${pelicula.idPelicula}"></td>
                    <td th:text="${pelicula.titulo}"></td>
                    <td th:text="${pelicula.genero}"></td>
                    <td th:text="${pelicula.stock}"></td>
                    <td>
                        <a th:href="@{/peliculas/editar/{id}(id=${pelicula.idPelicula})}"
                           class="btn btn-sm btn-outline-primary me-1">Editar</a>
                        <a th:href="@{/peliculas/eliminar/{id}(id=${pelicula.idPelicula})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Seguro de eliminar?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer>
        © Juber2025
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
