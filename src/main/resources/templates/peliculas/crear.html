<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Película</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-image: url('https://www.toptal.com/designers/subtlepatterns/patterns/wood_pattern.png');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #6b4e16;
        }

        label {
            font-weight: bold;
            color: #4e3b15;
        }

        .btn {
            border-radius: 20px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="form-container">
        <h1>Crear Nueva Película</h1>

        <form th:action="@{/peliculas}" th:object="${pelicula}" method="post">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título:</label>
                <input type="text" id="titulo" th:field="*{titulo}" required class="form-control" />
            </div>

            <div class="mb-3">
                <label for="genero" class="form-label">Género:</label>
                <input type="text" id="genero" th:field="*{genero}" required class="form-control" />
            </div>

            <div class="mb-3">
                <label for="stock" class="form-label">Stock:</label>
                <input type="number" id="stock" th:field="*{stock}" required min="0" class="form-control" />
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="/peliculas" class="btn btn-secondary">Volver al listado</a>
            </div>
        </form>
    </div>
    <div class="footer mt-4">
        © Juber  -  2025
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
