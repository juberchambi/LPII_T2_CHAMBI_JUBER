<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #fdf6ec; /* Fondo claro cálido */
            font-family: 'Segoe UI', sans-serif;
            color: #3a2e1f;
        }

        .full-height {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h2 {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
            color: #6b3e26;
        }

        .table-container {
            flex: 1;
        }

        .table {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .table-dark th {
            background-color: #6b3e26;
        }

        .btn-custom {
            border-radius: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: #8c735a;
            border-color: #8c735a;
        }

        footer {
            background-color: #3a2e1f;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

<div class="full-height container d-flex flex-column">
    <h2>CLIENTES REGISTRADOS</h2>

    <div class="table-container mb-4">
        <table class="table table-striped table-hover text-center mt-2">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cli : ${clientes}">
                    <td th:text="${cli.id}"></td>
                    <td th:text="${cli.nombre}"></td>
                    <td th:text="${cli.email}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mb-4">
        <a href="/" class="btn btn-secondary btn-custom">Volver al inicio</a>
    </div>

    <footer>
        © Juber2025
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
