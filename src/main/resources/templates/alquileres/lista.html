<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>DETALLE DE ALQUILERES</title>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #fdf6ec;
      font-family: 'Segoe UI', sans-serif;
      color: #3a2e1f;
    }

    .full-height {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 30px;
      color: #6b3e26;
    }

    .table-container {
      flex: 1;
    }

    .table {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .table-dark th {
      background-color: #6b3e26;
    }

    .btn-custom {
      border-radius: 20px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      transform: scale(1.05);
    }

    .btn-success {
      background-color: #a67c52;
      border-color: #a67c52;
    }

    .btn-success:hover {
      background-color: #8c6239;
      border-color: #8c6239;
    }

    .btn-secondary {
      background-color: #8c735a;
      border-color: #8c735a;
    }

    footer {
      background-color: #3a2e1f;
      color: white;
      text-align: center;
      padding: 10px 0;
      margin-top: auto;
    }
  </style>
</head>
<body>

<div class="container full-height d-flex flex-column">
  <h2>LISTA DE ALQUILERES</h2>

  <div class="d-flex justify-content-between mb-4">
    <a th:href="@{/alquileres/nuevo}" class="btn btn-success btn-custom">Nuevo alquiler</a>
    <a href="/" class="btn btn-secondary btn-custom">Volver</a>
  </div>

  <div class="table-container mb-4">
    <table class="table table-bordered table-hover text-center mt-2">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Total</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="alq : ${alquileres}">
          <td th:text="${alq.id}"></td>
          <td th:text="${alq.cliente.nombre}"></td>
          <td th:text="${alq.fecha}"></td>
          <td th:text="${alq.estado}"></td>
          <td th:text="${alq.total}"></td>
          <td>
            <a th:href="@{/alquileres/detalle(id=${alq.id})}" class="btn btn-sm btn-outline-info">Ver Detalle</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer>
    © Juber2025
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
